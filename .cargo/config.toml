[build]
# No global rustflags here on purpose:
#  - `-D warnings` would apply to registry crates and break the build on any
#    upstream deprecation warning. CI uses `cargo clippy -- -D warnings` instead.
#  - `target-cpu=native` produces non-portable binaries. Use an explicit,
#    widely supported baseline below.

[target.x86_64-unknown-linux-gnu]
rustflags = ["-C", "target-cpu=x86-64-v2"]

[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-cpu=x86-64-v2"]

[target.x86_64-apple-darwin]
rustflags = ["-C", "target-cpu=x86-64-v2"]

[target.aarch64-apple-darwin]
rustflags = ["-C", "target-cpu=apple-a14"]