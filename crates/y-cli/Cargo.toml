[package]
name = "y-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "ycode"
path = "src/main.rs"

[dependencies]
bytes = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde-saphyr = { version = "1.3", default-features = false, features = ["deserialize"] }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
y-gateway = { workspace = true }
y-types = { workspace = true }
clap = { version = "4.6", default-features = false, features = ["std", "help", "usage", "error-context"] }
tempfile = "3.27"
rmcp = { version = "3.5.1", default-features = false, features = ["client", "transport-async-rw", "transport-streamable-http-client"] }
reqwest = { workspace = true }
futures-util = { workspace = true }
http = "1"
sse-stream = "0.2"
unicode-width = "0.2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Pipes",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_System_Console",
    "Win32_Security",
] }
